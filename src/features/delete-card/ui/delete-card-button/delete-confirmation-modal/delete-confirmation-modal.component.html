<!-- Overlay -->
<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center" (click)="onClose()">
    <!-- Modal -->
    <div #dialog role="alertdialog" aria-modal="true" aria-labelledby="delete-dialog-title"
        aria-describedby="delete-dialog-message"
        class="bg-[#141414] border-2 border-red-600 rounded-lg p-6 max-w-md w-full mx-4 shadow-xl"
        (click)="$event.stopPropagation()" (keydown)="onKeydown($event)">
        <!-- Title -->
        <h2 id="delete-dialog-title" class="text-2xl font-bold text-white mb-4 text-center">
            Confirm deletion
        </h2>

        <!-- Message -->
        <p id="delete-dialog-message" class="text-white/90 mb-6 text-center">
            Are you sure you want to delete this card? This action is irreversible.
        </p>

        <!-- Buttons -->
        <div class="flex gap-3 justify-end">
            <button #cancelButton type="button" ubButton variant="outline" size="sm"
                class="cursor-pointer bg-gray-600 hover:bg-gray-700 text-black-600 hover:text-white"
                (click)="onClose()">
                Cancel
            </button>
            <button type="button" ubButton variant="destructive" size="sm" class="cursor-pointer bg-red-600 hover:bg-red-700"
                (click)="onConfirm()">
                Delete
            </button>
        </div>
    </div>
</div>
