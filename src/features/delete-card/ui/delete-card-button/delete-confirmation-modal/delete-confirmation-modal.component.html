<!-- Overlay -->
<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center" (click)="onClose()">
    <!-- Modal -->
    <div #dialog role="alertdialog" aria-modal="true" aria-labelledby="delete-dialog-title"
        aria-describedby="delete-dialog-message"
        class="bg-[var(--logo-panel)] border-2 border-[var(--logo-red)] p-6 max-w-md w-full mx-4 shadow-xl"
        (click)="$event.stopPropagation()" (keydown)="onKeydown($event)">
        <!-- Title -->
        <h2 id="delete-dialog-title" class="font-[family-name:var(--font-logo)] text-2xl uppercase text-[var(--logo-red)] [text-shadow:0_2px_0_#000] mb-4 text-center">
            Confirm deletion
        </h2>

        <!-- Message -->
        <p id="delete-dialog-message" class="text-[var(--logo-text)] mb-6 text-center">
            Are you sure you want to delete this card? This action is irreversible.
        </p>

        <!-- Buttons -->
        <div class="flex gap-3 justify-end">
            <button #cancelButton type="button" class="dokkan-btn" (click)="onClose()">
                Cancel
            </button>
            <button type="button" class="dokkan-btn dokkan-btn--danger-solid" (click)="onConfirm()">
                Delete
            </button>
        </div>
    </div>
</div>
