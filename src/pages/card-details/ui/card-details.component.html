@if (card$ | async; as cards) {
@if (displayedCard(); as displayedCard) {
<div class="flex flex-col items-center py-8 min-h-screen">
    <!-- Top Bar with Back Button and Actions -->
    <div class="w-full max-w-5xl px-4 flex justify-between items-center gap-3 mb-8">
        <a [routerLink]="['/user', cards.currentCard.creatorId, 'cards']" class="dokkan-btn">
            <ng-icon name="heroArrowLeft" class="h-5 w-5" />
            <span class="hidden sm:inline">Back to collection</span>
            <span class="sm:hidden">Back</span>
        </a>

        @if (canUpdate$ | async) {
        <div class="flex gap-3">
            <a [routerLink]="['/card', displayedCard.id, 'update']" class="dokkan-btn" aria-label="Update card">
                <ng-icon name="heroPencilSquare" class="h-5 w-5" />
                <span class="hidden sm:inline">Update</span>
            </a>
            <app-delete-card-button [cardId]="displayedCard.id ?? ''" (deleted)="onCardDeleted()" />
        </div>
        }
    </div>

    <!-- Card Title Section -->
    <div class="text-center mb-8 px-4">
        <h1 class="dokkan-header text-3xl md:text-5xl mb-3 break-words">
            {{displayedCard.cardName}}
        </h1>
        <p class="card-meta">
            Created by <span class="card-meta__name">{{displayedCard.creatorName}}</span>
        </p>
    </div>

    <!-- Share link -->
    <div class="w-full max-w-xl px-4 mb-8">
        <div class="share-box">
            <span class="share-box__label">Share</span>
            <span class="share-box__link select-all">{{ shareLink() }}</span>
            <button type="button" (click)="copyShareLink()" class="dokkan-btn dokkan-btn--icon"
                [class.is-active]="isCopied()" [attr.aria-label]="isCopied() ? 'Link copied' : 'Copy share link'">
                @if (isCopied()) {
                <ng-icon name="heroCheck" class="h-5 w-5" />
                } @else {
                <ng-icon name="heroClipboard" class="h-5 w-5" />
                }
            </button>
            <!-- Announces the copy to screen readers -->
            <span class="sr-only" aria-live="polite">{{ isCopied() ? 'Link copied' : '' }}</span>
        </div>
    </div>

    <app-card [baseCard]="cards.baseCard" [transformedCard]="cards.transformedCard" [(selectedCard)]="selectedCard" />
</div>
}
}

@if(isLoading()) {
<app-loader [isVisible]="isLoading()" />
}
