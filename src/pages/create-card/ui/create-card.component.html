<div class="container mx-auto px-4 py-8 max-w-5xl">
    <div class="text-center mb-8">
        <h1 class="dokkan-header text-4xl md:text-5xl mb-2">Card <span class="dokkan-header__word-2">Creator</span></h1>
        <p class="text-gray-400">Forge your own Dokkan Battle Card</p>
    </div>

    <!-- dokkan-form: logo theme for the card form (remove the class to restore the previous look) -->
    <div class="dokkan-form">
        <form class="flex flex-col gap-8" (ngSubmit)="onSubmit()" [formGroup]="cardForm">
            <app-card-form controlKey="cardForm" label="Card Details" (artwork)="handleArtwork($event)"
                (transformationChanged)="handleTransformationChanged($event)" />

            <!-- Transformation Section -->
            @if (showTransformationSection()) {
            <app-transformation-selector [userCards]="(userCards$ | async) ?? []"
                [transformedCardForm]="transformedCardForm" [(mode)]="transformationMode"
                [(selectedCardId)]="selectedExistingCardId" [showSelectionError]="hasSubmitAttempt() && isTransformationSelectionMissing()" (transformedArtwork)="handleTransformedArtwork($event)" />
            }

            <div class="flex justify-center mt-8 pt-8 border-t border-[var(--logo-line)]">
                <button type="submit" class="dokkan-btn dokkan-btn--lg is-active">
                    @if (hasTransformation()) {
                    Create Cards
                    } @else {
                    Create Card
                    }
                </button>
            </div>
        </form>
    </div>
</div>
<ng-container #card />
