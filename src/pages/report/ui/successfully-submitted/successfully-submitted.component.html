<!-- Success Message -->
<div class="dokkan-panel p-8 animate-fade-in">
    <div class="flex flex-col items-center gap-4 text-center">
        <div class="w-16 h-16 rounded-full bg-[var(--logo-yellow)]/15 border-2 border-[var(--logo-yellow)] flex items-center justify-center">
            <svg class="w-8 h-8 text-[var(--logo-yellow)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h2 class="dokkan-panel__title text-2xl">Message Sent!</h2>
        <p class="text-[#d8c3a0] max-w-md">
            Thank you for your feedback.
        </p>
        <a [routerLink]="['/']" class="dokkan-btn mt-4">Go back to home</a>
    </div>
</div>
