<div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="dokkan-header text-3xl md:text-4xl mb-2">Support <span class="dokkan-header__word-2">the </span><span

        <p class="text-[#d8c3a0]">
            Dokkan Card Maker is free and made on my spare time. If you enjoy it, you can help cover the hosting

    <div class="grid gap-6 sm:grid-cols-2">

        <!-- Ko-fi -->

            <p class="text-sm text-[#d8c3a0] flex-1">Buy me a coffee, no account needed.</p>
            <a href="https://ko-fi.com/F3B02AW0P6" target="_blank" rel="noopener noreferrer"

                <img ngSrc="https://storage.ko-fi.com/cdn/kofi6.png?v=6" width="143" height="36"
