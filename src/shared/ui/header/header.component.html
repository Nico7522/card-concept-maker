<header class="sticky top-0 z-50 border-b border-[var(--logo-line)] bg-[var(--logo-bg)] backdrop-blur-sm py-2">
    <div class="container mx-auto px-3 sm:px-4 lg:px-6">
        <div class="flex items-center justify-between gap-4 h-14 sm:h-16">
            <!-- Logo / Title (test: image title) -->
            <a routerLink="/" class="header-logo flex flex-col items-start gap-1 no-underline min-w-0">
                <img src="title_logo.png" alt="Dokkan Card Maker" width="862" height="138"
                    class="h-8 sm:h-10 w-auto max-w-full" />
                <span class="header-version hidden sm:block">v{{ version }}</span>
            </a>

            <!-- User Section -->
            <div class="flex items-center gap-3">
                @if(user$ | async; as user) {
                <!-- Connected User - Desktop -->
                <nav aria-label="Main" class="hidden sm:flex items-center gap-3">
                    <app-header-nav-button text="Create a card" icon="plus" [navigateTo]="['/create']" />
                    <app-header-nav-button text="My Cards" icon="cards" [navigateTo]="['/user', user.uid, 'cards']" />
                    <app-header-nav-button text="Support" icon="heart" [navigateTo]="['/support']" />
                    <app-header-nav-button text="Logout" icon="logout" [navigateTo]="['/']"
                        [highlightActive]="false" (click)="logout()" />
                </nav>

                <!-- Hamburger Button - Mobile -->
                <div class="sm:hidden relative">
                    <button type="button" (click)="toggleMenu()" class="dokkan-btn dokkan-btn--icon"
                        [class.is-active]="menuOpen()" [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
                        [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu">
                        @if(menuOpen()) {
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
                            <path d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        } @else {
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
                            <path d="M4 7h16M4 12h16M4 17h16" />
                        </svg>
                        }
                    </button>

                    <!-- Mobile Menu Dropdown -->
                    @if(menuOpen()) {
                    <nav id="mobile-menu" aria-label="Main"
                        class="absolute right-0 top-14 w-60 p-2.5 flex flex-col gap-2 bg-[var(--logo-menu)] border border-[var(--logo-line)] shadow-xl z-50">
                        <app-header-nav-button text="Create a card" icon="plus" [navigateTo]="['/create']"
                            [isMobileVersion]="true" (click)="closeMenu()" />
                        <app-header-nav-button text="My Cards" icon="cards" [navigateTo]="['/user', user.uid, 'cards']"
                            [isMobileVersion]="true" (click)="closeMenu()" />
                        <app-header-nav-button text="Support" icon="heart" [navigateTo]="['/support']"
                            [isMobileVersion]="true" (click)="closeMenu()" />
                        <app-header-nav-button text="Logout" icon="logout" [navigateTo]="['/']"
                            [isMobileVersion]="true" [highlightActive]="false" (click)="logout(); closeMenu()" />
                    </nav>
                    }
                </div>
                } @else {
                <!-- Unconnected User -->
                <div class="hidden lg:block text-xs text-gray-400 italic">
                    Log in to save your creations
                </div>

                <!-- Support - Desktop -->
                <nav aria-label="Main" class="hidden sm:flex">
                    <app-header-nav-button text="Support" icon="heart" [navigateTo]="['/support']" />
                </nav>

                <!-- Support - Mobile -->
                <a routerLink="/support" routerLinkActive="is-active" aria-label="Support the project"
                    class="sm:hidden dokkan-btn dokkan-btn--icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
                        <path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" />
                    </svg>
                </a>

                <!-- Login Button -->
                <button type="button" (click)="loginWithGoogle()" class="dokkan-btn is-active">
                    <svg class="google-icon w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="currentColor"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="currentColor"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="currentColor"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span class="hidden sm:inline">Login with Google</span>
                    <span class="sm:hidden">Login</span>
                </button>
                }
            </div>
        </div>
    </div>
</header>
